[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hlpw6-aiml-submission"
version = "0.1.0"
description = "HiLiftAeroML evaluation and confidential submission packaging for HLPW6 AI/ML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "HLPW6 AI/ML Technical Working Group"}]
dependencies = ["numpy==2.2.6", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
native = ["vtk==9.5.2", "numba>=0.61,<0.63"]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1", "build>=1.3,<2"]

[project.scripts]
hlpw6-aiml = "hlpw6_aiml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hlpw6_aiml"]

[tool.hatch.build.targets.wheel.force-include]
"contract" = "hlpw6_aiml/contract"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/hlpw6_aiml/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
